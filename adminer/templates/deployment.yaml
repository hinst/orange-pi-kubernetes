apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  labels:
    app: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: adminer
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: hinst-website-storage
          persistentVolumeClaim:
            claimName: hinst-website-storage
        - name: web-counter
          persistentVolumeClaim:
            claimName: web-counter
      containers:
      - name: adminer
        image: hinst/adminer
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 60
        volumeMounts:
          - name: hinst-website-storage
            mountPath: /data/saved-goals
            readOnly: false
          - name: web-counter
            mountPath: /data/web-counter
            readOnly: false
