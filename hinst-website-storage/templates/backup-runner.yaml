apiVersion: batch/v1
kind: CronJob
metadata:
  name: hinst-website-backup
spec:
  schedule: "0 0 * * SUN"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: hinst-website-backup-script
            - name: backup
              persistentVolumeClaim:
                claimName: hinst-website-backups
          containers:
            - name: hinst-website-backup
              image: postgres:18
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              command: ["/bin/bash"]
              args: ["/script/backup.sh"]
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: backup
                  mountPath: /data/hinst-website-backups
                  readOnly: false
              envFrom:
                - secretRef:
                  name: backup-secret
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi
