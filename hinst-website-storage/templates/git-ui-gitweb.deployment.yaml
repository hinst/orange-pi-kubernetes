apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-ui-gitweb
  namespace: hinst-website
  labels:
    app: git-ui-gitweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-ui-gitweb
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: git-ui-gitweb
    spec:
      containers:
        - name: git-ui-gitweb
          image: localhost:5000/mlan/docker-gitweb:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: PROJECTROOT
              value: /var/lib/git/repositories
            - name: PROJECTS_LIST
              value: ""
          volumeMounts:
            - name: history
              mountPath: /var/lib/git/repositories/hinst-website-history
              readOnly: true
          resources:
            requests:
              cpu: 0
              memory: 0
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: hinst-website-history
