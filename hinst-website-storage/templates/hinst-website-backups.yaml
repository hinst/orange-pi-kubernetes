apiVersion: v1
kind: PersistentVolume
metadata:
  name: hinst-website-backups
spec:
  storageClassName: hinst-website-backups
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /home/orangepi/App/hinst-website-backups
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hinst-website-backups
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: hinst-website-backups
  resources:
    requests:
      storage: 1Gi
