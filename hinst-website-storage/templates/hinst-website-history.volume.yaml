apiVersion: v1
kind: PersistentVolume
metadata:
  name: hinst-website-history
spec:
  storageClassName: hinst-website-history
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /home/orangepi/App/hinst-website-history
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hinst-website-history
spec:
  storageClassName: hinst-website-history
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
