apiVersion: batch/v1
kind: CronJob
metadata:
  name: hinst-website-history-backup
spec:
  schedule: "0 1 * * SUN"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: commit-history-script
              configMap:
                name: commit-history-script
                defaultMode: 0755
            - name: history
              persistentVolumeClaim:
                claimName: hinst-website-history
          initContainers:
            - name: 0-clean
              image: alpine
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              command: ["rm"]
              args: ["-r", "-f", "db"]
              workingDir: "/history"
              volumeMounts:
                - name: history
                  mountPath: /history
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi

            - name: 1-backup
              image: localhost:5000/hinst/hinst-website:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              args: ["--mode=backup", "--backup-directory=/history/db"]
              envFrom:
                - secretRef:
                    name: hinst-website-secret-values
              env:
                - name: GOMEMLIMIT
                  value: "900MiB"
                - name: GOGC
                  value: "20"
              volumeMounts:
                - name: history
                  mountPath: /history
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi
          containers:
            - name: 2-git-commit
              image: alpine/git
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              command: ["/bin/sh", "/scripts/commit-history.sh"]
              volumeMounts:
                - name: history
                  mountPath: /history
                - name: commit-history-script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi
