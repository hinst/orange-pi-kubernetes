apiVersion: batch/v1
kind: CronJob
metadata:
  name: hinst-website-history-backup
spec:
  schedule: "0 1 * * SUN"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: commit-history-script
              configMap:
                name: commit-history-script
                defaultMode: 0755
            - name: history
              persistentVolumeClaim:
                claimName: hinst-website-history
          initContainers:
            # Delete data
            - name: clean
              image: localhost:5000/hinst/postgresql-split
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              command: ["rm"]
              args:
                ["-r -f db"]
              workingDir: "/history"
              volumeMounts:
                - name: history
                  mountPath: /history
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi

            # Write backup
            - name: backup
              image: localhost:5000/hinst/hinst-website:latest
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              args:
                ["--mode=backup", "--backup-directory=/history/db"]
              envFrom:
                - secretRef:
                    name: hinst-website-secret-values
              volumeMounts:
                - name: history
                  mountPath: /history
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi

            # Commit
            - name: git-commit
              image: alpine/git
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              command: ["/bin/sh", "/scripts/commit-history.sh"]
              volumeMounts:
                - name: history
                  mountPath: /history
                - name: commit-history-script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                limits:
                  cpu: "1"
                  memory: 1Gi
          containers:
            - name: backup-complete
              image: alpine:latest
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  echo History backup completed
              volumeMounts:
                - name: history
                  mountPath: /history
