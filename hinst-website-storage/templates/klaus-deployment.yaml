apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-ui-klaus
  namespace: hinst-website
  labels:
    app: git-ui-klaus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-ui-klaus
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: git-ui-klaus
    spec:
      containers:
        - name: git-ui-klaus
          image: jonashaag/klaus:latest
          command: ["klaus"]
          args: ["/repos", "--host", "0.0.0.0"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: KLAUS_REPOS
              value: /repos
          volumeMounts:
            - name: history
              mountPath: /repos
              readOnly: true
          resources:
            requests:
              cpu: 1m
              memory: 50Mi
            limits:
              cpu: "2"
              memory: 300Mi
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: hinst-website-history
