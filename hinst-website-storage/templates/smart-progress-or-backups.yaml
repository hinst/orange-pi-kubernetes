apiVersion: v1
kind: PersistentVolume
metadata:
  name: smart-progress-or-backups
spec:
  storageClassName: smart-progress-or-backups
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /home/orangepi/App/smart-progress-or-backups
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-progress-or-backups
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: smart-progress-or-backups
  resources:
    requests:
      storage: 1Gi
