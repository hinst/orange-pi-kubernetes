apiVersion: apps/v1
kind: Deployment
metadata:
  name: hinst-website
  labels:
    app: hinst-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hinst-website
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hinst-website
    spec:
      containers:
        - name: hinst-website
          image: 192.168.0.23:30001/hinst/hinst-website:latest
          imagePullPolicy: Always
          args: ["--allowOrigin=https://hinst.github.io"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /hinst-website
              port: 8080
            periodSeconds: 60
          envFrom:
            - secretRef:
                name: hinst-website-secret-values
          env:
            - name: GOMEMLIMIT
              value: "150MiB"
            - name: GOGC
              value: "20"
          resources:
            requests:
              cpu: 1m
              memory: 1
            limits:
              cpu: 2
              memory: 200Mi
