apiVersion: apps/v1
kind: Deployment
metadata:
  name: hinst-website
  labels:
    app: hinst-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hinst-website
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hinst-website
    spec:
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smart-progress-or
      containers:
      - name: hinst-website
        image: hinst/hinst-website:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /hinst-website
            port: 8080
          periodSeconds: 60
        volumeMounts:
          - name: data
            mountPath: /app/saved-goals
            readOnly: true
        resources:
          limits:
            cpu: 1
            memory: 100Mi

