apiVersion: apps/v1
kind: Deployment
metadata:
  name: hinst-website
  labels:
    app: hinst-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hinst-website
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hinst-website
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: hinst-website
          image: hinst/hinst-website:latest
          imagePullPolicy: Always
          args: ["--allowOrigin=https://hinst.github.io"]
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /hinst-website
              port: 8080
            periodSeconds: 60
          envFrom:
            - secretRef:
                name: hinst-website-secret-values
          env:
            - name: GOMEMLIMIT
              value: "150MiB"
            - name: GOGC
              value: "20"
          resources:
            requests:
              cpu: 0
              memory: 0
            limits:
              cpu: 1
              memory: 200Mi
