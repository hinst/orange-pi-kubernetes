apiVersion: batch/v1
kind: Job
metadata:
  name: hinst-website-migration-01
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: hinst-website-migration
          image: hinst/hinst-website:latest
          imagePullPolicy: Always
          args: ["--mode=migrate"]
          envFrom:
            - secretRef:
                name: hinst-website-secret-values
          resources:
            requests:
              cpu: 0
              memory: 0
            limits:
              cpu: 1
              memory: 300Mi
