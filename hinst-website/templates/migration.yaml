apiVersion: batch/v1
kind: Job
metadata:
  name: hinst-website-migration-01
spec:
  suspend: false
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smart-progress-or
      containers:
        - name: hinst-website-migration
          image: hinst/hinst-website:latest
          imagePullPolicy: Always
          args: ["--mode=migrate"]
          volumeMounts:
            - name: data
              mountPath: /app/saved-goals
              readOnly: false
          envFrom:
            - secretRef:
                name: hinst-website-admin
          resources:
            requests:
              cpu: 0
              memory: 0
            limits:
              cpu: 1
              memory: 300Mi
