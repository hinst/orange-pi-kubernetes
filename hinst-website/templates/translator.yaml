apiVersion: batch/v1
kind: CronJob
metadata:
  name: hinst-website-translator
spec:
  schedule: "0 0 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: smart-progress-or
          containers:
          - name: hinst-website-translator
            image: hinst/hinst-website:latest
            imagePullPolicy: Always
            args: ["--mode=translate", "--translatorApi=http://192.168.0.3:1235"]
            volumeMounts:
              - name: data
                mountPath: /app/saved-goals
                readOnly: false
            resources:
              requests:
                cpu: 0
                memory: 0
              limits:
                cpu: 1
                memory: 100Mi
