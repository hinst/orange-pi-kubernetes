apiVersion: batch/v1
kind: CronJob
metadata:
  name: hinst-website-update
spec:
  schedule: "15 0 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: smart-progress-or
          containers:
          - name: hinst-website-update
            image: hinst/hinst-website:latest
            imagePullPolicy: Always
            args: ["--mode=update", "--translatorApi=http://192.168.0.25:1235"]
            volumeMounts:
              - name: data
                mountPath: /app/saved-goals
                readOnly: false
            envFrom:
              - secretRef:
                  name: hinst-website-admin
              - configMapRef:
                  name: hinst-website-config
            resources:
              requests:
                cpu: 0
                memory: 0
              limits:
                cpu: 1
                memory: 300Mi
