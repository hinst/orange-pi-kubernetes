apiVersion: batch/v1
kind: CronJob
metadata:
  name: hinst-website-update
spec:
  schedule: "15 22 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: hinst-website-storage
            - name: secret
              secret:
                secretName: hinst-website-secret-files
          containers:
          - name: hinst-website-update
            image: hinst/hinst-website:latest
            imagePullPolicy: Always
            args: ["--mode=update", "--translatorApi=http://192.168.0.31:1235"]
            volumeMounts:
              - name: data
                mountPath: /app/saved-goals
                readOnly: false
              - name: secret
                mountPath: /app/secret
                readOnly: true
            envFrom:
              - secretRef:
                  name: hinst-website-secret-values
              - configMapRef:
                  name: hinst-website-config
            env:
              - name: GOMEMLIMIT
                value: "200MiB"
              - name: GOOGLE_ACCOUNT_JSON
                value: /app/secret/hinst-github-io-key.json
            resources:
              requests:
                cpu: "0"
                memory: "0"
              limits:
                cpu: "1"
                memory: 300Mi
