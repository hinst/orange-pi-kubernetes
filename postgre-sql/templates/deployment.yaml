apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgre-sql
  labels:
    app: postgre-sql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgre-sql
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: postgre-sql
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgre-sql
      containers:
      - name: postgre-sql
        image: postgres:18
        imagePullPolicy: Always
        ports:
        - containerPort: 5432
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql
            readOnly: false
        envFrom:
          - secretRef:
              name: postgre-sql
        resources:
          requests:
            cpu: 0
            memory: 0
          limits:
            cpu: 1
            memory: 300Mi
