apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgre-sql
spec:
  storageClassName: postgre-sql
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOncePod
  hostPath:
    path: /home/orangepi/App/postgre-sql
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgre-sql
spec:
  accessModes:
  - ReadWriteOncePod
  storageClassName: postgre-sql
  resources:
    requests:
      storage: 1Gi
