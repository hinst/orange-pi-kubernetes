apiVersion: batch/v1
kind: CronJob
metadata:
  name: downloader
spec:
  schedule: "0 22 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: downloader
              image: localhost:5000/hinst/smart-progress-do-downloader:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
              envFrom:
                - configMapRef:
                    name: downloader-config
                - secretRef:
                    name: downloader-secret
              env:
                - name: NODE_OPTIONS
                  value: --max-old-space-size=250
              resources:
                requests:
                  cpu: 1m
                  memory: 1
                limits:
                  cpu: 1
                  memory: 300Mi
          dnsConfig:
            options:
              - name: ndots
                value: "1"
