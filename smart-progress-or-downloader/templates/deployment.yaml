apiVersion: batch/v1
kind: CronJob
metadata:
  name: downloader
spec:
  schedule: "0 22 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: downloader
              image: hinst/smart-progress-do-downloader:latest
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: downloader-config
                - secretRef:
                    name: downloader-secret
              resources:
                requests:
                  cpu: 1m
                  memory: 1
                limits:
                  cpu: 1
                  memory: 300Mi
          dnsConfig:
            options:
              - name: ndots
                value: "1"
