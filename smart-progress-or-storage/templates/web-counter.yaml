apiVersion: v1
kind: PersistentVolume
metadata:
  name: web-counter
spec:
  storageClassName: local-path
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /home/orangepi/App/web-counter
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-counter
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
