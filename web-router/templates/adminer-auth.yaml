apiVersion: v1
kind: Secret
metadata:
  name: adminer-auth
  namespace: default
type: Opaque
stringData:
  users.txt: |
    admin:{{ .Files.Get "traefikPassword.txt" }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: adminer-auth
  namespace: default
spec:
  basicAuth:
    secret: adminer-auth
