apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-router
  minReadySeconds: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web-router
    spec:
      volumes:
        - name: web-router-config
          configMap:
            name: web-router-config
        - name: web-router-files
          configMap:
            name: web-router-files
      containers:
        - name: caddy
          image: 192.168.0.23:30001/hinst/orange-caddy:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-router-config
              mountPath: /etc/caddy
            - name: web-router-files
              mountPath: /usr/share/caddy
          resources:
            requests:
              cpu: 1m
              memory: 1
            limits:
              cpu: 1
              memory: 200Mi
