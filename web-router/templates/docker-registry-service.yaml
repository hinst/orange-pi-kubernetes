apiVersion: v1
kind: Service
metadata:
   name: docker-registry-service
spec:
   clusterIP: None
   ports:
   - protocol: TCP
     port: 5000
     targetPort: 5000
   selector:
     name: example
   type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: docker-registry-service
subsets:
  - addresses:
    - ip: 127.0.0.1
    ports:
      - port: 5000