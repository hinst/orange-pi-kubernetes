apiVersion: v1
kind: Service
metadata:
  name: docker-registry-service
spec:
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: docker-registry-service
subsets:
  - addresses:
      - ip: 10.42.0.1 # Replace with your specific K3s host gateway IP if different
    ports:
      - port: 5000