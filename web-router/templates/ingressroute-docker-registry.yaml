apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: docker-registry-router
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/v2`)
      kind: Rule
      middlewares:
        - name: docker-registry-auth
      services:
        - name: docker-registry-service
          port: 5000
