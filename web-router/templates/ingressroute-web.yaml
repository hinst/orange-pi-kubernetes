apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-router
  namespace: smart-progress-or
spec:
  entryPoints:
    - web
  routes:
    # ---- public routes (rate-limited) ----
    - match: PathPrefix(`/hinst-website`)
      kind: Rule
      middlewares:
        - name: rate-limit
      services:
        - name: hinst-website
          namespace: smart-progress-or
          port: 8080
    - match: PathPrefix(`/web-counter`)
      kind: Rule
      middlewares:
        - name: rate-limit
      services:
        - name: web-counter
          namespace: smart-progress-or
          port: 8080

    # ---- protected routes (rate-limited + basic auth) ----
    - match: PathPrefix(`/adminer`)
      kind: Rule
      middlewares:
        - name: rate-limit
        - name: adminer-auth
      services:
        - name: adminer
          namespace: smart-progress-or
          port: 8080

