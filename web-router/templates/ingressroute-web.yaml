apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web-router
  namespace: hinst-website
spec:
  entryPoints:
    - web
  routes:
    # ---- public routes ----
    # Bypass rate limit for hinst-website when accessed from 192.168.0.31
    - match: Host(`192.168.0.23`) && PathPrefix(`/hinst-website`)
      kind: Rule
      middlewares:
        - name: compress
      services:
        - name: hinst-website
          namespace: hinst-website
          port: 8080
    # Rate-limited fallback for hinst-website (all other hosts)
    - match: PathPrefix(`/hinst-website`)
      kind: Rule
      middlewares:
        - name: compress
        - name: rate-limit
      services:
        - name: hinst-website
          namespace: hinst-website
          port: 8080
    - match: PathPrefix(`/web-counter`)
      kind: Rule
      middlewares:
        - name: rate-limit
      services:
        - name: web-counter
          namespace: hinst-website
          port: 8080

    # ---- protected routes (rate-limited + basic auth) ----
    - match: PathPrefix(`/adminer`)
      kind: Rule
      middlewares:
        - name: rate-limit
        - name: adminer-auth
      services:
        - name: adminer
          namespace: hinst-website
          port: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`192.168.0.23`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      middlewares:
        - name: traefik-auth
      services:
        - name: api@internal
          kind: TraefikService


