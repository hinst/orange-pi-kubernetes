apiVersion: v1
kind: Secret
metadata:
  name: traefik-auth
  namespace: hinst-website
type: Opaque
stringData:
  users.txt: |
    admin:{{ .Files.Get "traefikPassword.txt" }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-auth
  namespace: hinst-website
spec:
  basicAuth:
    secret: traefik-auth
